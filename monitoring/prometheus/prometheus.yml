global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # QuantTime Streamlit Dashboard
  - job_name: 'quanttime-dashboard'
    static_configs:
      - targets: ['host.docker.internal:8501']
    metrics_path: '/_stcore/metrics'
    scrape_interval: 30s

  # QuantTime Ray Cluster
  - job_name: 'quanttime-ray'
    static_configs:
      - targets: ['host.docker.internal:10001']
    scrape_interval: 30s

  # Node Exporter (if available)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['host.docker.internal:9100']
    scrape_interval: 30s

  # Custom QuantTime Metrics
  - job_name: 'quanttime-metrics'
    static_configs:
      - targets: ['host.docker.internal:8000']
    scrape_interval: 30s
